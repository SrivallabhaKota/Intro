<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Pixel Pop Photo Reveal</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    height: 100dvh; /* Mobile dynamic viewport height */
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    touch-action: manipulation;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
}

#finalImage {
    position: fixed;
    inset: 0;
    object-fit: contain; /* Flexible fit across mobile, tablet, laptop */
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 2;
    margin: auto;
}

/* File selection & error overlay */
#fileOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    padding: 24px;
    backdrop-filter: blur(10px);
}

.file-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 24px;
    box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    transition: transform 0.2s ease, background 0.2s ease;
}

.file-btn:active {
    transform: scale(0.96);
}

#fileInput {
    display: none;
}

/* Tap to replay hint for mobile */
.tap-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.6);
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.8s ease;
}

.tap-hint.visible {
    opacity: 1;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- Final Photo -->
<img id="finalImage" alt="Final Photo">

<div class="tap-hint" id="tapHint">Tap anywhere to restart</div>

<div id="fileOverlay" style="display: none;">
    <h2 style="font-size: 22px; font-weight: 600;">Select Your Photo</h2>
    <p style="color: #aaa; margin-top: 10px; font-size: 14px; max-width: 320px;">
        Tap below to choose any photo from your device gallery or camera.
    </p>
    <button class="file-btn" onclick="document.getElementById('fileInput').click()">Choose Photo</button>
</div>

<input type="file" id="fileInput" accept="image/*">

<script>

/*
    ========================================================
    RESPONSIVE PIXEL POP PHOTO REVEAL (MOBILE / TABLET / PC)
    ========================================================
*/

const CANDIDATE_SOURCES = [
    "images/photo.jpg",
    "images/photo.jpeg",
    "images/photo.png",
    "images/photo.webp",
    "images/photo.avif",
    "images/photo.jfif",
    "images/photo.bmp",
    "images/photo.gif",
    "images/photo",
    "images/myphoto.jpg",
    "images/venkateswara.jpg",
    "images/chandu2.jpeg",
    "photo.jpg",
    "photo.jpeg",
    "photo.png",
    "photo.webp"
];

const FALLBACK_DATA_URL = "";

let REVEAL_TIME = 5500;
let PARTICLE_STEP = 5;
let PARTICLE_SIZE = 3.5;
let POP_DURATION = 360;
let BRIGHTNESS = 1.22;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const finalImage = document.getElementById("finalImage");
const fileOverlay = document.getElementById("fileOverlay");
const fileInput = document.getElementById("fileInput");
const tapHint = document.getElementById("tapHint");

let image = new Image();

let width = 0;
let height = 0;
let imageWidth = 0;
let imageHeight = 0;
let imageX = 0;
let imageY = 0;
let particles = [];
let animationStart = 0;
let animFrameId = null;
let isRevealed = false;

// Device Pixel Ratio (DPI) handling for sharp mobile rendering
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    width = window.innerWidth || document.documentElement.clientWidth;
    height = window.innerHeight || document.documentElement.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    // Dynamic particle sizing based on screen resolution
    if (width < 600) {
        // Mobile screen adjustments
        PARTICLE_STEP = 4;
        PARTICLE_SIZE = 3.2;
    } else if (width < 1024) {
        // Tablet screen adjustments
        PARTICLE_STEP = 5;
        PARTICLE_SIZE = 3.5;
    } else {
        // Desktop / Laptop screen adjustments
        PARTICLE_STEP = 5;
        PARTICLE_SIZE = 3.6;
    }

    if (image.complete && image.naturalWidth > 0) {
        calculateImage();
    }
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 200));
resize();

/*
    ============================
    IMAGE DISCOVERY & LOADING
    ============================
*/

function discoverImage() {
    let index = 0;

    function tryNext() {
        if (index < CANDIDATE_SOURCES.length) {
            const src = CANDIDATE_SOURCES[index];
            index++;

            const testImg = new Image();
            testImg.onload = function () {
                loadPhotoSource(src);
            };
            testImg.onerror = function () {
                tryNext();
            };
            testImg.src = src + "?t=" + Date.now();
        } else {
            if (FALLBACK_DATA_URL && FALLBACK_DATA_URL.length > 50) {
                loadPhotoSource(FALLBACK_DATA_URL);
            } else {
                fileOverlay.style.display = "flex";
            }
        }
    }

    tryNext();
}

function loadPhotoSource(src) {
    fileOverlay.style.display = "none";
    finalImage.style.opacity = "0";
    tapHint.classList.remove("visible");
    isRevealed = false;

    if (animFrameId) cancelAnimationFrame(animFrameId);

    image = new Image();
    image.onload = function () {
        calculateImage();
        const success = createParticles();
        if (success) {
            startAnimation();
        }
    };
    image.onerror = function () {
        if (FALLBACK_DATA_URL && FALLBACK_DATA_URL.length > 50 && src !== FALLBACK_DATA_URL) {
            loadPhotoSource(FALLBACK_DATA_URL);
        } else {
            fileOverlay.style.display = "flex";
        }
    };
    image.src = src;
    finalImage.src = src;
}

// Start discovery
discoverImage();

/*
    ============================
    FILE SELECTION & TOUCH / DRAG
    ============================
*/

fileInput.addEventListener("change", (e) => {
    if (e.target.files && e.target.files.length > 0) {
        readAndLoadFile(e.target.files[0]);
    }
});

window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        readAndLoadFile(e.dataTransfer.files[0]);
    }
});

function readAndLoadFile(file) {
    const reader = new FileReader();
    reader.onload = function (evt) {
        loadPhotoSource(evt.target.result);
    };
    reader.readAsDataURL(file);
}

// Touch and click anywhere to restart once revealed
function handleTap() {
    if (isRevealed) {
        startAnimation();
    }
}
window.addEventListener("click", handleTap);
window.addEventListener("touchstart", (e) => {
    if (isRevealed && !e.target.closest('#fileOverlay') && !e.target.closest('.file-btn')) {
        handleTap();
    }
}, { passive: true });

/*
    ================================================
    CALCULATE PERFECT IMAGE FIT (MOBILE/TABLET/PC)
    ================================================
*/

function calculateImage() {
    const originalWidth = image.naturalWidth;
    const originalHeight = image.naturalHeight;

    // Use contain mode so 100% of photo is visible without cropping on any mobile/tablet/PC screen
    const scale = Math.min(
        width / originalWidth,
        height / originalHeight
    );

    imageWidth = Math.ceil(originalWidth * scale);
    imageHeight = Math.ceil(originalHeight * scale);

    imageX = Math.floor((width - imageWidth) / 2);
    imageY = Math.floor((height - imageHeight) / 2);

    finalImage.style.width = imageWidth + "px";
    finalImage.style.height = imageHeight + "px";
    finalImage.style.left = imageX + "px";
    finalImage.style.top = imageY + "px";
}

/*
    ============================
    CREATE PARTICLES
    ============================
*/

function createParticles() {
    particles = [];

    const tempCanvas = document.createElement("canvas");
    const tempCtx = tempCanvas.getContext("2d");

    tempCanvas.width = imageWidth;
    tempCanvas.height = imageHeight;

    tempCtx.drawImage(image, 0, 0, imageWidth, imageHeight);

    let imageData;
    try {
        imageData = tempCtx.getImageData(0, 0, imageWidth, imageHeight);
    } catch (err) {
        console.warn("Canvas read error:", err);
        if (FALLBACK_DATA_URL && FALLBACK_DATA_URL.length > 50 && image.src !== FALLBACK_DATA_URL) {
            loadPhotoSource(FALLBACK_DATA_URL);
            return false;
        }
        fileOverlay.style.display = "flex";
        return false;
    }

    for (let y = 0; y < imageHeight; y += PARTICLE_STEP) {
        for (let x = 0; x < imageWidth; x += PARTICLE_STEP) {
            const index = (y * imageWidth + x) * 4;
            let r = imageData.data[index];
            let g = imageData.data[index + 1];
            let b = imageData.data[index + 2];
            const a = imageData.data[index + 3];

            if (a < 60) continue;

            r = Math.min(255, r * BRIGHTNESS);
            g = Math.min(255, g * BRIGHTNESS);
            b = Math.min(255, b * BRIGHTNESS);

            const targetX = imageX + x;
            const targetY = imageY + y;
            const delay = Math.random() * (REVEAL_TIME - POP_DURATION);

            particles.push({
                x: targetX,
                y: targetY,
                r: Math.round(r),
                g: Math.round(g),
                b: Math.round(b),
                size: PARTICLE_SIZE,
                delay: delay
            });
        }
    }

    // Shuffle for natural appearance
    particles.sort(() => Math.random() - 0.5);
    return true;
}

function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function startAnimation() {
    if (animFrameId) cancelAnimationFrame(animFrameId);
    finalImage.style.opacity = "0";
    tapHint.classList.remove("visible");
    isRevealed = false;
    animationStart = performance.now();
    animFrameId = requestAnimationFrame(animate);
}

function animate(timestamp) {
    const elapsed = timestamp - animationStart;
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const localTime = elapsed - p.delay;

        if (localTime <= 0) continue;

        let progress = localTime / POP_DURATION;
        progress = Math.max(0, Math.min(1, progress));

        const pop = easeOutBack(progress);
        const size = Math.max(0, p.size * pop);

        ctx.fillStyle = 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')';
        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
    }

    if (elapsed < REVEAL_TIME + POP_DURATION) {
        animFrameId = requestAnimationFrame(animate);
    } else {
        finishReveal();
    }
}

function finishReveal() {
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.fillStyle = 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')';
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }

    setTimeout(revealPhoto, 600);
}

function revealPhoto() {
    finalImage.style.opacity = "1";
    isRevealed = true;
    setTimeout(() => {
        tapHint.classList.add("visible");
    }, 400);
}

</script>
</body>
</html>
